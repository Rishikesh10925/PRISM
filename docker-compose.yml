services:
  db:
    image: postgis/postgis:16-3.4
    container_name: prism_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism_dev_password
    ports:
      - "5433:5432"  # 5432 is already used by another local project's container
    volumes:
      - prism_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prism_db_data:
