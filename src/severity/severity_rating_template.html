<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM Severity Rating</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #18202b; --muted: #5d6b7c; --border: #dde2e8;
    --accent: #2563eb; --outline: #facc15; --good: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141a; --panel: #18202a; --text: #e6ebf1; --muted: #93a1b2; --border: #2a3542; --accent: #60a5fa; --good: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; }
  .progress { flex: 1; min-width: 160px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .muted { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 300px; }
  .stage-inner { position: relative; max-width: 100%; }
  .stage img { display: block; width: 100%; height: auto; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stage polygon { fill: none; stroke: var(--outline); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .stage.hide svg { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-self: start; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; }
  .rate { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  .rate small { display: block; color: var(--muted); }
  .rate.sel { border-color: var(--accent); }
  kbd { flex: none; font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--muted); }
  .nav { display: flex; gap: 8px; }
  button.btn { flex: 1; padding: 8px 10px; font: inherit; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .help { color: var(--muted); font-size: 13px; margin: 0; }
  .done { color: var(--good); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>PRISM — how severe is this pothole?</h1>
  <div class="progress"><div id="bar"></div></div>
  <span class="muted" id="count"></span>
  <span class="muted" id="saved"></span>
</header>
<main>
  <section>
    <div class="stage" id="stage"><div class="stage-inner"><img id="img" alt="road photo with the pothole to rate outlined"><svg id="svg" preserveAspectRatio="none"></svg></div></div>
    <p class="help" style="margin-top:8px">Rate only the pothole <b>outlined in yellow</b>. Hold <kbd>Space</kbd> to hide the outline. Image <b id="itemid"></b></p>
  </section>
  <aside class="panel">
    <h2>If a vehicle hit this pothole…</h2>
    <button class="rate" data-r="1"><kbd>1</kbd><span>Negligible<small>Surface wear; you'd barely notice driving over it.</small></span></button>
    <button class="rate" data-r="2"><kbd>2</kbd><span>Minor<small>A noticeable bump; no real risk.</small></span></button>
    <button class="rate" data-r="3"><kbd>3</kbd><span>Moderate<small>Uncomfortable; drivers would slow down or steer around it.</small></span></button>
    <button class="rate" data-r="4"><kbd>4</kbd><span>Severe<small>Could damage a tyre or wheel, or unbalance a two-wheeler.</small></span></button>
    <button class="rate" data-r="5"><kbd>5</kbd><span>Critical<small>Dangerous; needs urgent repair.</small></span></button>
    <button class="rate" data-r="0"><kbd>0</kbd><span>Can't judge<small>Outline is not a pothole, or the photo is unclear.</small></span></button>
    <div class="nav">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn" id="next">Next →</button>
    </div>
    <p class="help">Pick a number and it moves to the next photo. Every answer saves automatically — close the tab any time and come back.</p>
    <p class="help" id="status"></p>
  </aside>
</main>
<script>
const ITEMS = /*__ITEMS__*/[];
const $ = id => document.getElementById(id);
let answers = {};
let idx = 0;
let timer = null;

function rows() {
  return ITEMS.map(it => ({ rating_id: it.id, image: it.image, instance: it.instance, rating: answers[it.id] ?? "" }));
}
function sync() {
  clearTimeout(timer);
  $("saved").textContent = "Saving…";
  timer = setTimeout(() => fetch("/save", { method: "POST", body: JSON.stringify(rows()) })
    .then(r => { if (!r.ok) throw new Error(); $("saved").textContent = "✓ Saved"; })
    .catch(() => { $("saved").textContent = "⚠ Not saved — is the rating server running?"; }), 250);
}
function render() {
  const it = ITEMS[idx];
  $("img").src = it.src;
  document.querySelector(".stage-inner").style.width = `min(100%, ${(70 * it.w / it.h).toFixed(2)}vh)`;
  $("svg").setAttribute("viewBox", `0 0 ${it.w} ${it.h}`);
  $("svg").innerHTML = `<polygon points="${it.polygon.map(p => p.join(",")).join(" ")}"/>`;
  $("itemid").textContent = `${it.id} (${idx + 1} of ${ITEMS.length})`;
  document.querySelectorAll(".rate").forEach(b => b.classList.toggle("sel", b.dataset.r === String(answers[it.id] ?? "")));
  const done = ITEMS.filter(x => (answers[x.id] ?? "") !== "").length;
  $("bar").style.width = `${100 * done / ITEMS.length}%`;
  $("count").textContent = `${done} / ${ITEMS.length} rated`;
  $("status").innerHTML = done === ITEMS.length ? '<span class="done">All done — tell Claude "rating done".</span>' : "";
}
function go(i) { idx = Math.min(ITEMS.length - 1, Math.max(0, i)); render(); }
function rate(r) { answers[ITEMS[idx].id] = r; sync(); idx < ITEMS.length - 1 ? go(idx + 1) : render(); }

document.querySelectorAll(".rate").forEach(b => b.onclick = () => rate(b.dataset.r));
$("prev").onclick = () => go(idx - 1);
$("next").onclick = () => go(idx + 1);
document.addEventListener("keydown", e => {
  if ("012345".includes(e.key) && e.key.length === 1) rate(e.key);
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === " ") { e.preventDefault(); $("stage").classList.add("hide"); }
});
document.addEventListener("keyup", e => { if (e.key === " ") $("stage").classList.remove("hide"); });

fetch("/answers").then(r => r.json()).then(saved => {
  saved.forEach(row => { if (row.rating !== "") answers[row.rating_id] = row.rating; });
  const firstOpen = ITEMS.findIndex(it => (answers[it.id] ?? "") === "");
  idx = firstOpen >= 0 ? firstOpen : 0;
  $("saved").textContent = "Answers save automatically";
  render();
}).catch(() => { $("saved").textContent = "⚠ Open this page via the rating server"; render(); });
</script>
</body>
</html>
